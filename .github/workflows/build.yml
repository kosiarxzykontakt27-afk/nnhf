name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        id: p
        run: |
          f=$(find . -name build.gradle | head -1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
        working-directory: ${{ steps.p.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: ElevenClients
          path: |
            ${{ steps.p.outputs.dir }}/build/libs/*.jar
            !${{ steps.p.outputs.dir }}/build/libs/*-sources.jar
